<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <defs>
    <linearGradient id="metallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4d4d4"/>
      <stop offset="30%" style="stop-color:#c0c0c0"/>
      <stop offset="50%" style="stop-color:#b0b0b0"/>
      <stop offset="70%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </linearGradient>
    <linearGradient id="metalBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#888"/>
      <stop offset="50%" style="stop-color:#666"/>
      <stop offset="100%" style="stop-color:#555"/>
    </linearGradient>
  </defs>

  <!-- Shield/badge shape -->
  <path d="M40,30 L80,15 L240,15 L280,30 L295,55 L295,105 L280,140 L240,155 L80,155 L40,140 L25,105 L25,55 Z"
        fill="url(#metallic)" stroke="url(#metalBorder)" stroke-width="3"/>
  <path d="M50,35 L85,22 L235,22 L270,35 L283,55 L283,100 L270,130 L235,143 L85,143 L50,130 L37,100 L37,55 Z"
        fill="none" stroke="#777" stroke-width="1"/>

  <!-- "It's the Film" text -->
  <text x="160" y="12" text-anchor="middle" font-family="'Georgia', serif" font-size="14" font-style="italic" fill="#333">"It's the Film"</text>

  <!-- Registered trademark -->
  <text x="282" y="18" font-family="Arial, sans-serif" font-size="12" fill="#555">&#174;</text>

  <!-- PREVENTS WEAR and CORROSION -->
  <text x="160" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333" letter-spacing="1">PREVENTS WEAR and</text>
  <text x="160" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333" letter-spacing="1">CORROSION</text>

  <!-- LUBRIPLATE main text -->
  <text x="160" y="100" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-size="36" font-weight="900" fill="#1A1A1A" letter-spacing="2">LUBRIPLATE</text>

  <!-- SUPER-LUBRICATION -->
  <text x="160" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333" letter-spacing="2">SUPER&#8211;</text>
  <text x="160" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333" letter-spacing="2">LUBRICATION</text>

  <!-- Decorative lines -->
  <line x1="65" y1="70" x2="255" y2="70" stroke="#666" stroke-width="1"/>
  <line x1="65" y1="108" x2="255" y2="108" stroke="#666" stroke-width="1"/>
</svg>
