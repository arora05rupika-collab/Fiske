  <!-- White LUBRIPLATE wordmark -->
  <text
    x="170"
    y="50"
    text-anchor="middle"
    font-family="'Arial Black', 'Franklin Gothic Heavy', 'Impact', sans-serif"
    font-size="38"
    font-weight="900"
